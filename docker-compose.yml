services:
  database:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: fparttime-db
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - fparttime-net

  db-migrator:
    build:
      context: ./Backend
      dockerfile: DbMigrator/Dockerfile
    container_name: fparttime-db-migrator
    profiles: ["tools"]
    environment:
      - ConnectionStrings__DefaultConnection=Server=database,1433;Database=FPartTime;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
    depends_on:
      - database
    networks:
      - fparttime-net

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: fparttime-backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ConnectionStrings__DefaultConnection=Server=database,1433;Database=FPartTime;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - JwtSettings__AccessTokenExpirationInMinutes=${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES}
      - JwtSettings__RefreshTokenExpirationInDays=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS}
      - R2Settings__ServiceURL=${R2_SERVICE_URL}
      - R2Settings__PublicDomain=${R2_PUBLIC_DOMAIN}
      - R2Settings__AccessKey=${R2_ACCESS_KEY}
      - R2Settings__SecretKey=${R2_SECRET_KEY}
      - R2Settings__PublicBucketName=${R2_PUBLIC_BUCKET_NAME}
      - R2Settings__PrivateBucketName=${R2_PRIVATE_BUCKET_NAME}
      - R2Settings__PresignedGetExpirySeconds=${R2_PRESIGNED_GET_EXPIRY_SECONDS}
      - SystemHealthCheck__HeaderName=${HEALTH_CHECK_HEADER}
      - SystemHealthCheck__ApiKey=${HEALTH_CHECK_API_KEY}
    depends_on:
      - database
    networks:
      - fparttime-net

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: fparttime-frontend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - BackendApi__BaseUrl=${BACKEND_API_BASE_URL}
      - BackendApi__AccessTokenAllowedHosts=${BACKEND_API_ALLOWED_HOSTS}
    depends_on:
      - backend
    networks:
      - fparttime-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: fparttime-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
      - backend
    networks:
      - fparttime-net

volumes:
  mssql_data:
    name: fparttime_mssql_data

networks:
  fparttime-net:
    name: fparttime-net
