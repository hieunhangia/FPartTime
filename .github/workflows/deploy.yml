name: CI/CD Pipeline

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  TARGET_PLATFORM: linux/arm64

jobs:
  # -------------------------------------------------------------
  # 1. Phát hiện các module thay đổi trong commit
  # -------------------------------------------------------------
  changes:
    runs-on: ubuntu-24.04-arm
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      db_migrator: ${{ steps.filter.outputs.db_migrator }}
      compose: ${{ steps.filter.outputs.compose }}
      any_build: ${{ steps.filter.outputs.backend == 'true' || steps.filter.outputs.frontend == 'true' || steps.filter.outputs.db_migrator == 'true' || steps.filter.outputs.compose == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'Backend/Api/**'
              - 'Backend/Service/**'
              - 'Backend/Repository/**'
              - 'Backend/Dockerfile'
              - 'Backend/.dockerignore'
              - 'Backend/*.sln*'
            frontend:
              - 'Frontend/**'
            db_migrator:
              - 'Backend/DbMigrator/**'
              - 'Backend/Repository/**'
            compose:
              - 'docker-compose.yml'
              - '.github/workflows/deploy.yml'

  # -------------------------------------------------------------
  # 2. Build & Push Backend API (Chạy song song - ARM64)
  # -------------------------------------------------------------
  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.compose == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lowercase repository name
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend API (ARM64)
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          platforms: ${{ env.TARGET_PLATFORM }}
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/backend:latest
            ghcr.io/${{ env.REPO_LC }}/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend-arm64
          cache-to: type=gha,mode=max,scope=backend-arm64

  # -------------------------------------------------------------
  # 3. Build & Push Frontend Client (Chạy song song - ARM64)
  # -------------------------------------------------------------
  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.compose == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lowercase repository name
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Frontend Client (ARM64)
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          platforms: ${{ env.TARGET_PLATFORM }}
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/frontend:latest
            ghcr.io/${{ env.REPO_LC }}/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend-arm64
          cache-to: type=gha,mode=max,scope=frontend-arm64

  # -------------------------------------------------------------
  # 4. Build & Push DbMigrator (Chạy song song - ARM64)
  # -------------------------------------------------------------
  build-migrator:
    needs: changes
    if: needs.changes.outputs.db_migrator == 'true' || needs.changes.outputs.compose == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lowercase repository name
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push DbMigrator (ARM64)
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          file: ./Backend/DbMigrator/Dockerfile
          platforms: ${{ env.TARGET_PLATFORM }}
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/db-migrator:latest
            ghcr.io/${{ env.REPO_LC }}/db-migrator:${{ github.sha }}
          cache-from: type=gha,scope=dbmigrator-arm64
          cache-to: type=gha,mode=max,scope=dbmigrator-arm64

  # -------------------------------------------------------------
  # 5. Triển khai lên Oracle ARM VPS qua SSH
  # -------------------------------------------------------------
  deploy:
    needs: [changes, build-backend, build-frontend, build-migrator]
    if: |
      always() &&
      needs.changes.outputs.any_build == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "docker-compose.yml"
          target: ${{ secrets.SERVER_WORKDIR }}

      - name: Deploy to Oracle ARM VPS via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_WORKDIR: ${{ secrets.SERVER_WORKDIR }}
          UPDATE_BACKEND: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.compose == 'true' || github.event_name == 'workflow_dispatch' }}
          UPDATE_FRONTEND: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.compose == 'true' || github.event_name == 'workflow_dispatch' }}
          UPDATE_MIGRATOR: ${{ needs.changes.outputs.db_migrator == 'true' || needs.changes.outputs.compose == 'true' || github.event_name == 'workflow_dispatch' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: GITHUB_ACTOR,GITHUB_TOKEN,SERVER_WORKDIR,UPDATE_BACKEND,UPDATE_FRONTEND,UPDATE_MIGRATOR
          script: |
            set -e
            cd "$SERVER_WORKDIR"

            echo "=== 1. Logging in to GHCR ==="
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            echo "=== 2. Pulling only updated ARM64 images ==="
            SERVICES_TO_PULL=""
            [ "$UPDATE_BACKEND" = "true" ] && SERVICES_TO_PULL="$SERVICES_TO_PULL backend"
            [ "$UPDATE_FRONTEND" = "true" ] && SERVICES_TO_PULL="$SERVICES_TO_PULL frontend"
            [ "$UPDATE_MIGRATOR" = "true" ] && SERVICES_TO_PULL="$SERVICES_TO_PULL db-migrator"

            if [ -n "$SERVICES_TO_PULL" ]; then
              echo "Pulling updated images:$SERVICES_TO_PULL"
              docker compose pull $SERVICES_TO_PULL
            else
              echo "No images needed to pull."
            fi

            if [ "$UPDATE_MIGRATOR" = "true" ]; then
              echo "=== 3. Database changes detected -> Running database migrations ==="
              docker compose run --rm db-migrator --migrate
            else
              echo "=== 3. No database schema changes detected -> Skipping migrations ==="
            fi

            echo "=== 4. Recreating updated containers ==="
            docker compose up -d --remove-orphans

            echo "=== 5. Cleaning up old images ==="
            docker image prune -f

            echo "=== 6. Logging out of GHCR ==="
            docker logout ghcr.io

            echo "=== Deployment to Oracle ARM Completed Successfully! ==="
